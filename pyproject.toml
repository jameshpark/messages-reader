description = "Read-only local service for iMessage/SMS history"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyinstaller>=6.16",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
